name: vicosafood-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      # Renderiza as paginas Inertia no servidor pra SEO/GEO (meta tags, JSON-LD) chegarem
      # prontas no HTML, sem depender de JS -- ver resources/js/ssr.js e o servico "ssr"
      # abaixo. Se esse servico cair ou nao responder, Inertia\Ssr\HttpGateway cai pra
      # client-side rendering sozinho; nunca quebra a resposta.
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: "http://ssr:13714"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ssr:
        condition: service_started
    # Nao monta nada em public/storage -- e' onde docker/entrypoint.sh cria o symlink pro
    # disco "public" (storage/app/public, dentro do volume storage_data acima). Um volume
    # montado ali por cima impediria esse symlink de existir (o Docker sempre materializa
    # um bind/volume mount como diretorio real, nunca preserva o que a imagem tinha ali),
    # deixando qualquer upload gravado mas inacessivel via /storage/... -- ver nginx abaixo.
    volumes:
      - storage_data:/var/www/html/storage/app
      - public_assets:/srv/public
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.6

  # Node rodando o bundle SSR do Inertia (resources/js/ssr.js) -- "app" fala com ele por
  # HTTP (INERTIA_SSR_URL acima). Sem volumes/env_file: o bundle e' auto-contido
  # (ssr.noExternal:true no vite.config.js) e nao precisa de nenhuma config do Laravel.
  ssr:
    image: ${IMAGE_NAME}-ssr:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13714/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3

  queue:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    pull_policy: always
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      # only "app" migrates on boot — see docker/entrypoint.sh
      RUN_MIGRATIONS: "false"
    command: php artisan queue:work --tries=1 --timeout=0
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.3

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - app
    # Published directly (not localhost-only): Cloudflare's edge connects straight to this
    # port over HTTPS via a per-hostname Origin Rule ("food.vicosa.tech" -> rewrite port to
    # APP_PORT) — same mechanism already used for this VPS's other apps (e.g. concilia.vicosa.tech
    # -> 8443). There is no shared reverse proxy in front; prod.conf terminates TLS itself.
    ports:
      - "${APP_PORT:-8444}:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Same Cloudflare Origin Certificate (wildcard *.vicosa.tech) already on this VPS host
      # for the other apps — required because the zone's SSL/TLS mode is Full (strict).
      - /etc/ssl/cloudflare:/etc/nginx/ssl:ro
      - public_assets:/srv/public:ro
      # Mesmo volume que "app" usa pra storage/app -- storage/app/public e' o disco "public"
      # do Laravel, dai o prod.conf apontar o alias pra "/srv/storage/public/", nao a raiz.
      - storage_data:/srv/storage:ro
    mem_limit: 64m
    mem_reservation: 16m
    cpus: 0.2

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.4
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # requirepass: without it, anything on the docker network could read/write cache,
    # session and queue data. appendonly: without it a restart silently drops queued jobs.
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.2
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  storage_data:
  public_assets:
