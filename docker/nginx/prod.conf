# Production-only nginx config. Unlike docker/nginx/default.conf (plain HTTP, used by local
# dev's docker-compose.yml), this terminates TLS directly — Cloudflare's zone SSL/TLS mode is
# "Full (strict)", and an Origin Rule rewrites food.vicosa.tech's origin port straight to this
# container's published port (no shared reverse proxy on this VPS is involved, unlike CatalogIA's
# own app/web split). A self-signed or absent cert here would be rejected outright by Cloudflare.
#
# The cert/key are NOT part of the image — they're the same long-lived Cloudflare Origin
# Certificate (wildcard *.vicosa.tech) already used by the other apps on this VPS, mounted
# read-only from the host filesystem at deploy time (see docker-compose.prod.yml).
server {
    listen 443 ssl;
    server_name _;
    root /srv/public;
    index index.php index.html;
    client_max_body_size 50M;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=5s;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /srv/storage is the storage_data volume mounted at its root (same volume the app
    # container has at storage/app) -- the "public" disk is the storage/app/public subpath.
    location /storage/ {
        alias /srv/storage/public/;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 8 256k;
        # This server block only ever terminates HTTPS — tell Laravel directly rather than
        # relying on a forwarded header that nothing here would set.
        fastcgi_param HTTPS on;
    }

    location ~ /\.ht {
        deny all;
    }
}
