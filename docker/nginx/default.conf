server {
    listen 80;
    server_name _;
    root /srv/public;
    index index.php index.html;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=5s;

    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /srv/storage is the storage_data volume mounted at its root (same volume the app
    # container has at storage/app) -- the "public" disk is the storage/app/public subpath.
    location /storage/ {
        alias /srv/storage/public/;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        set $upstream app:9000;
        fastcgi_pass $upstream;
        fastcgi_index index.php;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 8 256k;
    }

    location ~ /\.ht {
        deny all;
    }
}
